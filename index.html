<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orus · Confirmar asistencia</title>
<meta name="theme-color" content="#000000">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --negro:#000;
  --carbon:#0d0b07;
  --oro:#d9a521;
  --oro-claro:#f0cf6a;
  --oro-oscuro:#8f6a12;
  --marfil:#f4ecd8;
  --apagado:#b5a97f;
  --error:#ff8a73;
  --serif:"Cormorant Garamond",Georgia,"Times New Roman",serif;
  --sans:"Jost","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html{background:var(--negro)}
body{
  margin:0;min-height:100vh;background:var(--negro);color:var(--marfil);
  font-family:var(--sans);font-size:18px;line-height:1.5;
  display:flex;justify-content:center;
  padding:max(28px,env(safe-area-inset-top)) 22px max(40px,env(safe-area-inset-bottom));
}
main{width:100%;max-width:460px;text-align:center}
.logo{width:190px;height:190px;display:block;margin:0 auto 6px}
h1{
  font-family:var(--serif);font-weight:600;font-size:2.35rem;line-height:1.1;
  margin:14px 0 6px;color:var(--oro-claro);
  background:linear-gradient(180deg,var(--oro-claro),var(--oro) 70%);
  -webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
}
.fecha{margin:0;color:var(--apagado);font-size:1.05rem}
.filete{height:1px;border:0;margin:26px auto;width:70%;background:linear-gradient(90deg,transparent,var(--oro-oscuro),transparent)}
.invita{font-family:var(--serif);font-size:1.35rem;margin:0 0 24px;color:var(--marfil)}
form{text-align:left}
label,.etiqueta{display:block;font-size:1rem;color:var(--apagado);margin:0 0 6px}
.campo{margin-bottom:22px}
input[type=text],textarea{
  width:100%;background:var(--carbon);color:var(--marfil);
  border:1px solid var(--oro-oscuro);border-radius:6px;
  padding:14px 14px;font:inherit;
}
textarea{min-height:92px;resize:vertical}
input::placeholder,textarea::placeholder{color:#6f6647}
input:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--oro-claro);outline-offset:2px}
.cantidad{display:flex;align-items:center;gap:0;border:1px solid var(--oro-oscuro);border-radius:6px;background:var(--carbon);overflow:hidden}
.cantidad button{
  width:64px;height:56px;border:0;background:transparent;color:var(--oro-claro);
  font:500 1.8rem var(--sans);cursor:pointer;
}
.cantidad button:active{background:#1c1608}
.cantidad output{flex:1;text-align:center;font-family:var(--serif);font-size:1.9rem;color:var(--marfil)}
.cantidad small{display:block;font:400 .85rem var(--sans);color:var(--apagado);margin-top:-4px}
.enviar{
  width:100%;margin-top:6px;padding:17px 20px;border:0;border-radius:6px;cursor:pointer;
  background:linear-gradient(180deg,var(--oro-claro),var(--oro));
  color:#120d00;font:500 1.15rem var(--sans);letter-spacing:.02em;
}
.enviar:disabled{opacity:.6;cursor:default}
.aviso{min-height:1.4em;margin:14px 0 0;font-size:1rem;color:var(--error);text-align:center}
.trampa{position:absolute;left:-9999px;width:1px;height:1px;overflow:hidden}
.listo{display:none}
.listo h2{font-family:var(--serif);font-weight:600;font-size:2rem;margin:10px 0 8px;color:var(--oro-claro)}
.listo p{margin:0 0 6px;color:var(--marfil)}
.listo .detalle{color:var(--apagado)}
body.confirmado form,body.confirmado .invita{display:none}
body.confirmado .listo{display:block}
@media (prefers-reduced-motion:no-preference){
  .logo{animation:aparece 1.2s ease-out both}
  @keyframes aparece{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
}
</style>

  <h1 id="titulo">Orus</h1>
  <p class="fecha" id="fecha" hidden></p>
  <hr class="filete">

  <p class="invita">Confirmá tu asistencia</p>

  <form id="form" novalidate>
    <div class="campo">
      <label for="nombre">Nombre y apellido</label>
      <input type="text" id="nombre" name="nombre" autocomplete="name" placeholder="Ej.: María Pérez" required>
    </div>

    <div class="campo">
      <span class="etiqueta" id="lblCant">¿Cuántas personas van, contándote a vos?</span>
      <div class="cantidad" role="group" aria-labelledby="lblCant">
        <button type="button" id="menos" aria-label="Una persona menos">−</button>
        <output id="cant" aria-live="polite">1</output>
        <button type="button" id="mas" aria-label="Una persona más">+</button>
      </div>
    </div>

    <div class="campo">
      <label for="obs">Observaciones <span style="opacity:.7">(opcional)</span></label>
      <textarea id="obs" name="obs" placeholder="Ej.: una persona necesita menú sin TACC"></textarea>
    </div>

    <div class="trampa" aria-hidden="true">
      <label>No completar<input type="text" id="web" tabindex="-1" autocomplete="off"></label>
    </div>

    <button class="enviar" id="enviar" type="submit">Confirmar asistencia</button>
    <p class="aviso" id="aviso" role="alert"></p>
  </form>

  <section class="listo" id="listo" aria-live="polite">
    <h2>¡Listo, <span id="quien"></span>!</h2>
    <p id="resumen">Tu asistencia quedó confirmada.</p>
    <p class="detalle">Te esperamos en Orus.</p>
  </section>
</main>

<script>
// === CONFIGURACIÓN ===
// Pegá acá la URL de la aplicación web de Apps Script (termina en /exec)
const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyykIElP6F3hBYlepHv7MsN2p4u_6Z5ba53qQ0-fObjVKDEGohbj1Tb5tZY-2uXsisO/exec";

// === EVENTO (sale del link) ===
// Ejemplo: https://tu-sitio.netlify.app/?evento=cumple-juan&fecha=Sábado 14 de noviembre
const params = new URLSearchParams(location.search);
const slug = (params.get("evento") || "").trim();

function bonito(s){
  if(!s) return "Orus";
  const t = s.replace(/[-_]+/g," ").trim();
  return t.charAt(0).toUpperCase() + t.slice(1);
}
const nombreEvento = bonito(slug);
document.getElementById("titulo").textContent = nombreEvento;
document.title = nombreEvento + " · Orus";
const fecha = (params.get("fecha") || "").trim();
if (fecha){ const f = document.getElementById("fecha"); f.textContent = fecha; f.hidden = false; }

// === CANTIDAD ===
let cantidad = 1;
const cant = document.getElementById("cant");
document.getElementById("menos").onclick = () => { if(cantidad>1){ cantidad--; cant.textContent = cantidad; } };
document.getElementById("mas").onclick  = () => { if(cantidad<30){ cantidad++; cant.textContent = cantidad; } };

// === ENVÍO ===
const form = document.getElementById("form");
const aviso = document.getElementById("aviso");
const btn = document.getElementById("enviar");

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  aviso.textContent = "";
  if (document.getElementById("web").value) return; // antispam

  const nombre = document.getElementById("nombre").value.trim();
  const obs = document.getElementById("obs").value.trim();
  if (!nombre){ aviso.textContent = "Escribí tu nombre y apellido."; document.getElementById("nombre").focus(); return; }
  if (!slug){ aviso.textContent = "Este link no tiene un evento asociado. Pedí el link de nuevo."; return; }
  if (SCRIPT_URL.startsWith("PEGAR")){ aviso.textContent = "Falta configurar la conexión con la planilla."; return; }

  btn.disabled = true; btn.textContent = "Enviando…";
  try{
    await fetch(SCRIPT_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ evento: slug, nombre, cantidad, obs })
    });
    document.getElementById("quien").textContent = nombre.split(" ")[0];
    document.getElementById("resumen").textContent =
      cantidad === 1 ? "Tu asistencia quedó confirmada." : "Quedaron confirmadas " + cantidad + " personas.";
    document.body.classList.add("confirmado");
    window.scrollTo({top:0});
  }catch(err){
    aviso.textContent = "No se pudo enviar. Revisá tu conexión y probá de nuevo.";
    btn.disabled = false; btn.textContent = "Confirmar asistencia";
  }
});
</script>
</body>
</html>
